<style>
  :root{ --line:#000; --hdr:#d9d9d9; --accent:#1f5fa8; }
  *{ box-sizing:border-box; }
  body{ font-family:Arial, Helvetica, sans-serif; margin:0; background:#eceff1; color:#000; }

  .toolbar{ position:sticky; top:0; z-index:50; background:#263238; color:#fff;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 14px; }
  .toolbar b{ font-size:14px; margin-right:6px; }
  .toolbar button{ font:600 13px Arial; padding:8px 14px; border:0; border-radius:6px;
    cursor:pointer; background:var(--accent); color:#fff; }
  .toolbar button.sec{ background:#546e7a; }
  .toolbar button:hover{ filter:brightness(1.1); }
  .toolbar .status{ font-size:12px; opacity:.85; margin-left:auto; }

  .sheet{ width:820px; max-width:100%; margin:16px auto; background:#fff; border:2px solid var(--line); }
  table.form{ width:100%; border-collapse:collapse; table-layout:fixed; }
  table.form td{ border:1px solid var(--line); padding:3px 6px; font-size:12.5px; vertical-align:middle; height:26px; }
  .lbl{ font-weight:bold; white-space:nowrap; }
  .center{ text-align:center; }
  .band{ background:var(--hdr); font-weight:bold; }
  .title{ text-align:center; font-size:19px; font-weight:bold; letter-spacing:.5px; padding:6px; }
  input.titlefield{ width:100%; text-align:center; font:bold 19px Arial, Helvetica, sans-serif;
    letter-spacing:.5px; color:#000; background:transparent; border:0; border-bottom:1px dotted transparent;
    padding:0; margin:0; }
  input.titlefield:hover{ border-bottom:1px dotted #90a4ae; }
  input.titlefield:focus{ outline:none; border-bottom:1.5px solid var(--accent); background:#eef4fc; }
  .title.band{ padding:4px 6px; }
  .logo img{ max-width:120px; max-height:66px; height:auto; display:block; }
  .colhdr{ background:var(--hdr); font-weight:bold; text-align:center; }

  input.f, textarea.f{ font:12.5px Arial; border:0; border-bottom:1px dotted #9aa; background:transparent;
    padding:1px 2px; color:#00308f; font-weight:600; width:auto; }
  input.f:focus, textarea.f:focus{ outline:none; border-bottom:1.5px solid var(--accent); background:#eef4fc; }
  textarea.f{ resize:vertical; border:1px solid #cfd8dc; width:100%; display:block; }
  .remarks textarea{ min-height:70px; }

  .flexrow{ display:flex; align-items:center; gap:6px; flex-wrap:nowrap; width:100%; }
  .grow{ flex:1 1 40px; min-width:30px; }

  label.cb{ display:inline-flex; align-items:center; gap:4px; margin:0 16px 0 0; font-weight:bold; cursor:pointer; white-space:nowrap; }
  label.cb input{ width:15px; height:15px; accent-color:var(--accent); cursor:pointer; margin:0; }

  .sigwrap{ position:relative; }
  canvas.sig{ width:100%; height:54px; border:1px solid #cfd8dc; background:#fff;
    touch-action:none; display:block; border-radius:3px; }
  .sigclear{ position:absolute; top:2px; right:2px; font:10px Arial; padding:0 6px;
    border:1px solid #b0bec5; background:#fafafa; border-radius:4px; cursor:pointer; color:#455; }
  .sigclear:hover{ background:#eceff1; }

  .footer{ text-align:right; font-size:11px; padding:2px 8px; color:#333; }

  @media print{
    body{ background:#fff; }
    .toolbar, .sigclear, .noprint{ display:none !important; }
    .sheet{ margin:0; border:2px solid #000; width:100%; }
    table.form td{ font-size:11px; height:22px; padding:2px 5px; }
    input.f, textarea.f{ font-size:11px; color:#00308f; border-bottom:1px solid #999; background:transparent !important; }
    textarea.f{ border:1px solid #999; }
    .remarks textarea{ min-height:56px; }
    canvas.sig{ height:48px; }
    .title{ font-size:17px; }
    input.titlefield{ font-size:17px; color:#000; border-bottom:0 !important; background:transparent !important; }
    @page{ size:A4 portrait; margin:9mm; }
  }
</style>

    <td colspan="5"><div class="flexrow"><span class="lbl">Time:</span><input class="f grow" data-k="t_end" value="01:41 PM"></div></td>

      <label class="cb"><input type="checkbox" data-k="pass"> Pass</label>

<script>
/* ============ Sign-off rows ============ */
const roles = [["Tested By","tst"],["Witnessed By","wit"],["Acknowledged By","ack"]];
const sr = document.getElementById('signrows');
// Only build rows on a fresh form. A re-opened saved file already contains the
// rows (with their saved values) serialized in #signrows, so skip rebuilding.
if(sr.children.length===0) roles.forEach(([role,key])=>{
  const tr=document.createElement('tr');
  tr.innerHTML=
    '<td colspan="2"><span class="lbl">'+role+'</span></td>'+
    '<td colspan="3"><input class="f grow" data-k="'+key+'_name" value="" style="width:100%"></td>'+
    '<td colspan="4"><div class="sigwrap">'+
        '<canvas class="sig" data-sig="'+key+'"></canvas>'+
        '<button type="button" class="sigclear" onclick="clearSig(\''+key+'\')">Clear</button>'+
        '<input type="hidden" data-k="'+key+'_sig" value="">'+
      '</div></td>'+
    '<td colspan="3"><input class="f grow" data-k="'+key+'_date" value="" style="width:100%"></td>';
  sr.appendChild(tr);
});

/* ============ Signature pads ============ */
const pads = {};
function initPad(canvas){
  const key=canvas.dataset.sig; const ctx=canvas.getContext('2d');
  function fit(){
    const r=canvas.getBoundingClientRect(); const dpr=window.devicePixelRatio||1;
    canvas.width=Math.max(1,Math.round(r.width*dpr)); canvas.height=Math.max(1,Math.round(r.height*dpr));
    ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
    ctx.lineWidth=1.8; ctx.lineCap='round'; ctx.strokeStyle='#0a2472';
  }
  let drawing=false,last=null;
  function pos(e){ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; }
  function down(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing)return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; markDirty(); e.preventDefault(); }
  function up(){ drawing=false; }
  canvas.addEventListener('mousedown',down); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  canvas.addEventListener('touchstart',down,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',up);
  pads[key]={canvas,ctx,fit}; fit();
}
function clearSig(key){ const p=pads[key]; if(!p)return; p.ctx.clearRect(0,0,p.canvas.width,p.canvas.height); field(key+'_sig').value=''; markDirty(); }
function clearAllSignatures(){ Object.keys(pads).forEach(clearSig); setStatus('Signatures cleared'); }

/* ============ Helpers ============ */
function allFields(){ return document.querySelectorAll('[data-k]'); }
function field(k){ return document.querySelector('[data-k="'+k+'"]'); }
function setStatus(t){ const s=document.getElementById('status'); if(s){s.textContent=t; clearTimeout(s._t); s._t=setTimeout(()=>s.textContent='Ready',2500);} }

function syncToDOM(){
  Object.keys(pads).forEach(key=>{ const c=pads[key].canvas; field(key+'_sig').value=isCanvasBlank(c)?'':c.toDataURL('image/png'); });
  allFields().forEach(el=>{
    if(el.type==='checkbox'){ if(el.checked) el.setAttribute('checked','checked'); else el.removeAttribute('checked'); }
    else if(el.tagName==='TEXTAREA'){ el.textContent=el.value; }
    else { el.setAttribute('value',el.value); }
  });
}
function isCanvasBlank(c){ const b=document.createElement('canvas'); b.width=c.width; b.height=c.height; return c.toDataURL()===b.toDataURL(); }

function restoreSignatures(){
  Object.keys(pads).forEach(key=>{
    const el=field(key+'_sig'); if(!el)return; const data=el.value;
    if(data && data.startsWith('data:image')){
      const p=pads[key]; const img=new Image(); p._restoreImg=img;
      img.onload=()=>{ const r=p.canvas.getBoundingClientRect(); p.ctx.drawImage(img,0,0,r.width,r.height); };
      img.src=data; if(img.complete && img.naturalWidth) img.onload();
    }
  });
}

/* ============ Save as PDF ============ */
function saveAsPDF(){ syncToDOM(); setStatus('Opening print dialog…'); setTimeout(()=>window.print(),150); }

/* ============ Save as HTML (with entries embedded) ============ */
function saveAsHTML(){
  syncToDOM();
  const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  const blob=new Blob([html],{type:'text/html'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const slug=s=>(s||'').replace(/[^A-Za-z0-9_-]+/g,'_').replace(/^_+|_+$/g,'');
  const ttl=slug(field('doctitle')?field('doctitle').value:'').slice(0,40)||'Form';
  const ref=slug(field('from')?field('from').value:'').slice(0,30);
  a.href=url; a.download=ttl+(ref?'_'+ref:'')+'.html';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  setStatus('Saved HTML with your entries ✓');
}

/* ============ localStorage autosave ============ */
const LS_KEY='sanitary_flood_test_autosave_v1';
function collectData(){ syncToDOM(); const d={}; allFields().forEach(el=>{ d[el.dataset.k]=(el.type==='checkbox')?el.checked:el.value; }); return d; }
function applyData(d){ allFields().forEach(el=>{ const k=el.dataset.k; if(!(k in d))return; if(el.type==='checkbox') el.checked=!!d[k]; else el.value=d[k]; }); restoreSignatures(); syncTitle(); }
function autosave(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(collectData())); setStatus('Autosaved ✓'); }catch(e){} }
function restoreAutosave(){ try{ const raw=localStorage.getItem(LS_KEY); if(!raw){ setStatus('No autosave found'); return; } applyData(JSON.parse(raw)); setStatus('Restored last autosave ✓'); }catch(e){ setStatus('Restore failed'); } }
let dirtyT=null; function markDirty(){ clearTimeout(dirtyT); dirtyT=setTimeout(autosave,1200); }

/* ============ Init ============ */
function syncTitle(){
  const el=field('doctitle'); if(!el) return;
  const t=el.value.trim()||'Test Record';
  const tb=document.getElementById('toolbarTitle'); if(tb) tb.textContent=t;
  document.title=t;
}
window.addEventListener('load',()=>{
  document.querySelectorAll('canvas.sig').forEach(initPad);
  restoreSignatures();
  allFields().forEach(el=>{ el.addEventListener(el.type==='checkbox'?'change':'input', markDirty); });
  const t=field('doctitle');
  if(t){ t.addEventListener('input',syncTitle); syncTitle(); }
});
window.addEventListener('beforeprint',syncToDOM);
</script>
