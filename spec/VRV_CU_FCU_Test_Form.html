<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRV CU/FCU Test Form — Apple L2 Network Room</title>
<style>
  :root {
    --line:#000; --ink:#111; --shade:#e8edf4; --shade2:#d5deea; --accent:#1558b0;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body {
    background:#6b7280;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif; color:var(--ink);
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }

  .toolbar {
    position:sticky; top:0; z-index:50; display:flex; gap:10px; flex-wrap:wrap;
    align-items:center; padding:10px 16px; background:#1f2937; color:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .toolbar .title { font-weight:600; margin-right:auto; font-size:14px; letter-spacing:.3px; }
  .btn {
    border:0; border-radius:6px; padding:8px 14px; cursor:pointer; font-size:13px;
    font-weight:600; color:#fff; background:var(--accent); transition:filter .15s;
  }
  .btn:hover { filter:brightness(1.1); }
  .btn.secondary { background:#4b5563; }
  .btn.ghost { background:transparent; border:1px solid #6b7280; }

  /* A4 landscape sheet: 297mm x 210mm */
  .sheet {
    width:297mm; min-height:210mm; margin:18px auto; padding:8mm 9mm;
    background:#fff; box-shadow:0 6px 24px rgba(0,0,0,.35);
  }

  /* Header */
  .doc-head { display:flex; align-items:flex-start; gap:18px; margin-bottom:8px; }
  .logos { display:flex; align-items:center; gap:20px; padding-top:2px; }
  .logos img.l1 { height:52px; width:auto; }
  .logos img.l2 { height:52px; width:auto; }
  .proj { flex:1; }
  .proj table { border-collapse:collapse; width:100%; }
  .proj td { padding:2px 4px; font-size:13px; vertical-align:top; }
  .proj td.k { font-weight:700; white-space:nowrap; width:92px; }
  .proj td.c { width:12px; text-align:center; }
  .proj input {
    border:none; border-bottom:1px solid #b9c2cf; background:transparent;
    font-size:13px; font-weight:600; width:100%; outline:none; color:var(--ink);
    font-family:inherit; padding:1px 2px;
  }
  .proj input:focus { background:#fffbe6; }

  /* Main data table */
  table.grid { width:100%; border-collapse:collapse; table-layout:fixed; }
  table.grid th, table.grid td {
    border:1px solid var(--line); padding:2px 3px; font-size:11.5px; vertical-align:middle;
  }
  table.grid th { background:var(--shade); font-weight:700; text-align:center; }
  .grp { background:var(--shade2) !important; }
  .cell-input {
    width:100%; border:none; background:transparent; font-size:11.5px;
    font-family:inherit; outline:none; color:var(--ink); padding:1px 2px;
  }
  .cell-input:focus { background:#fffbe6; }
  .ta-center { text-align:center; }

  /* column widths (sum 100) */
  col.w-item { width:3.5%; }
  col.w-brand { width:7%; }
  col.w-equip { width:13%; }
  col.w-cum { width:11%; }
  col.w-fcum { width:11%; }
  col.w-low { width:5%; }
  col.w-high { width:5%; }
  col.w-cur { width:9%; }
  col.w-volt { width:6%; }
  col.w-pow { width:7.5%; }
  col.w-rem { width:14.5%; }

  .cur-multi { display:flex; flex-direction:column; gap:1px; }
  .cur-line { display:flex; align-items:center; gap:2px; }
  .cur-lab { font-size:10px; font-weight:700; width:22px; }
  .cur-inp { font-size:11px; }
  .cur-single .cur-inp { text-align:center; }

  /* Sign-off */
  .signoff-wrap { margin-top:10px; }
  table.signoff { width:100%; border-collapse:collapse; table-layout:fixed; }
  table.signoff th, table.signoff td { border:1px solid var(--line); font-size:12px; }
  table.signoff th { background:var(--shade); font-weight:700; padding:5px 6px; text-align:center; }
  .so-corner { background:var(--shade2) !important; text-align:left !important; }
  .so-rowlabel { background:var(--shade); font-weight:700; width:15%; padding:6px 8px; }
  .so-cell { padding:5px 8px; vertical-align:middle; }
  .so-input {
    width:100%; border:none; border-bottom:1px solid #888; background:transparent;
    font-size:12px; outline:none; padding:2px 0; font-family:inherit; color:var(--ink);
  }
  .so-input:focus { background:#fffbe6; }
  .so-sigcell { padding:4px 6px; }
  .sigwrap { position:relative; }
  .sigpad {
    width:100%; height:52px; border:1px solid #999; border-radius:4px;
    background:#fff; touch-action:none; display:block; cursor:crosshair;
  }
  .sig-clear {
    position:absolute; top:3px; right:3px; width:20px; height:20px; border:none;
    border-radius:4px; background:#e5e7eb; color:#555; cursor:pointer; font-size:11px;
    line-height:1; padding:0;
  }
  .sig-clear:hover { background:#d1d5db; }

  /* Print: A4 landscape */
  @page { size:A4 landscape; margin:8mm; }
  @media print {
    body { background:#fff; }
    .no-print { display:none !important; }
    .sheet { width:auto; min-height:auto; margin:0; padding:0; box-shadow:none; }
    input:focus, textarea:focus { background:transparent !important; }
    .sigpad { border:1px solid #999; }
  }
</style>
</head>

<script>
(function () {
  "use strict";
  var pads = [];

  function initPads() {
    document.querySelectorAll(".sigpad").forEach(function (canvas) {
      var idx = canvas.getAttribute("data-sig");
      var store = document.querySelector('.sigdata[data-sigstore="' + idx + '"]');
      var rect = canvas.getBoundingClientRect();
      var scale = 2;
      canvas.width = Math.round((rect.width || 240) * scale);
      canvas.height = Math.round((rect.height || 52) * scale);
      var ctx = canvas.getContext("2d");
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.lineWidth = 2 * scale; ctx.strokeStyle = "#0a2a6b";
      var pad = { canvas: canvas, ctx: ctx, store: store, drawing: false, empty: true };
      pads.push(pad);

      function pos(e) {
        var r = canvas.getBoundingClientRect();
        var cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
        var cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
        return { x: cx * (canvas.width / r.width), y: cy * (canvas.height / r.height) };
      }
      function start(e) { e.preventDefault(); pad.drawing = true; pad.empty = false;
        var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
      function move(e) { if (!pad.drawing) return; e.preventDefault();
        var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
      function end() { pad.drawing = false; }

      canvas.addEventListener("mousedown", start);
      canvas.addEventListener("mousemove", move);
      window.addEventListener("mouseup", end);
      canvas.addEventListener("touchstart", start, { passive: false });
      canvas.addEventListener("touchmove", move, { passive: false });
      canvas.addEventListener("touchend", end);

      if (store && store.value && store.value.indexOf("data:image") === 0) {
        var img = new Image();
        img.onload = function () { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); pad.empty = false; };
        img.src = store.value;
      }
    });

    document.querySelectorAll(".sig-clear").forEach(function (b) {
      b.addEventListener("click", function () {
        var idx = b.getAttribute("data-sigclear");
        var pad = pads.filter(function (p) { return p.canvas.getAttribute("data-sig") === idx; })[0];
        if (pad) { pad.ctx.clearRect(0, 0, pad.canvas.width, pad.canvas.height); pad.empty = true;
          if (pad.store) { pad.store.value = ""; pad.store.removeAttribute("value"); } }
      });
    });
  }

  function persist() {
    document.querySelectorAll('input[type="text"]').forEach(function (i) { i.setAttribute("value", i.value); });
    document.querySelectorAll("textarea").forEach(function (t) { t.textContent = t.value; });
    pads.forEach(function (p) {
      if (!p.empty) { var d = p.canvas.toDataURL("image/png");
        if (p.store) { p.store.value = d; p.store.setAttribute("value", d); } }
    });
  }

  window.saveHtml = function () {
    persist();
    var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    var blob = new Blob([html], { type: "text/html" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "VRV_CU_FCU_Test_Form_filled.html";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  };

  window.resetForm = function () {
    if (!confirm("Clear all entries on this form?")) return;
    document.querySelectorAll('input[type="text"]').forEach(function (i) {
      if (i.closest(".proj")) return; // keep header defaults
      i.value = "";
    });
    pads.forEach(function (p) { p.ctx.clearRect(0, 0, p.canvas.width, p.canvas.height); p.empty = true;
      if (p.store) p.store.value = ""; });
  };

  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", initPads);
  else initPads();
})();
</script>
